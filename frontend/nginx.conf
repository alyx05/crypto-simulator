server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # web shares api's network namespace (see network_mode in
    # docker-compose.yml), so the backend is reached over loopback here,
    # not over the bridge network as "api:18080" -- that's what was timing
    # out in this environment.
    set $api_upstream http://127.0.0.1:18080;

    # SPA fallback so client-side routes resolve the same way the Vite dev
    # server's default behaviour does.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No trailing path on proxy_pass here on purpose: nginx forwards the
    # original request URI unchanged (e.g. /api/v1/wallet -> /api/v1/wallet
    # on the backend), matching Crow's routes in ApiServer.cpp exactly.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}